name: Finam Weekly Strategy Batch (Read Only)
on:
  push:
    branches: [main]
    paths:
      - experimental_portfolio/weekly_strategy_lab.py
      - experimental_portfolio/deposit_benchmark.py
      - experimental_portfolio/EXPANDED_DEPOSIT_SCREEN.md
      - tests/test_weekly_strategy_lab.py
      - tests/test_deposit_benchmark.py
      - scripts/run_finam_weekly_strategy_batch.py
      - research_agent/finam_corporate_actions.py
      - tests/test_finam_corporate_actions.py
      - .github/workflows/finam-weekly-strategy-batch.yml
  pull_request:
    paths:
      - experimental_portfolio/weekly_strategy_lab.py
      - experimental_portfolio/deposit_benchmark.py
      - tests/test_weekly_strategy_lab.py
      - tests/test_deposit_benchmark.py
      - scripts/run_finam_weekly_strategy_batch.py
      - research_agent/finam_corporate_actions.py
      - tests/test_finam_corporate_actions.py
      - .github/workflows/finam-weekly-strategy-batch.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run research unit tests
        run: |
          python -m unittest tests.test_finam_corporate_actions -v
          python -m unittest tests.test_weekly_strategy_lab -v
          python -m unittest tests.test_deposit_benchmark -v
      - name: Probe public MOEX ISS corporate-action endpoints (read only)
        run: python scripts/probe_moex_iss_corporate_actions.py
      - name: Fetch validated bars and run expanded research
        env:
          FINAM_API_SECRET: ${{ secrets.FINAM_API_SECRET }}
          FINAM_ACCOUNT_ID: ${{ secrets.FINAM_ACCOUNT_ID }}
        run: python scripts/run_finam_weekly_strategy_batch.py
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-strategy-research
          path: research_output/
          retention-days: 90
          if-no-files-found: warn
