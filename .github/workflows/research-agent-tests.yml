name: Research Agent Safety Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research_agent/**"
      - "tests/**"
      - ".github/workflows/research-agent-tests.yml"
      - ".github/workflows/manual-openrouter-agent-smoke.yml"
      - ".github/workflows/research-agent-run.yml"
      - ".github/workflows/research-agent-multi-timeframe.yml"
      - ".github/workflows/research-agent-mtf-signals.yml"
      - ".github/workflows/research-agent-historical-replay.yml"
      - "HANDOFF_FOR_NEXT_AI.md"
      - "docs/HANDOFF.md"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile isolated research module
        run: python -m compileall -q research_agent tests
      - name: Run research unit tests
        run: |
          python -m unittest tests.test_agent_signal_verifier tests.test_agent_discovery tests.test_operational_forecast tests.test_operational_agent_integration -v
          python -m unittest tests.test_finam_strategy_backtest tests.test_candle_level_research tests.test_direction_forecast -v
          python -m unittest tests.test_finam_strategy_registry tests.test_research_multi_timeframe tests.test_multi_timeframe_validation tests.test_research_mtf_scanner tests.test_research_release_safety -v
          python -m unittest discover -s tests -p "test_research_*.py" -v
          python -m unittest discover -s tests -p "test_moex_iss.py" -v
          python -m unittest discover -s tests -p "test_moex_session_mapping.py" -v
          python -m unittest discover -s tests -p "test_moex_trading_day_bars.py" -v
          python -m unittest discover -s tests -p "test_finam_market_data.py" -v
          python -m unittest discover -s tests -p "test_finam_crosscheck.py" -v
          python -m unittest discover -s tests -p "test_finam_h1_crosscheck.py" -v
          python -m unittest discover -s tests -p "test_timeframe_reconciliation.py" -v
          python -m unittest discover -s tests -p "test_finam_timeframe_crosscheck.py" -v
