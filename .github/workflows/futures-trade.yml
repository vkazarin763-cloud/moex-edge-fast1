name: Futures Scanner (Trading Paused)

on:
  workflow_dispatch:

jobs:
  scan_and_execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pandas requests numpy
      - name: Run Futures Scanner
        run: python futures_scanner.py
      - name: Run Futures Executor (blocked unless explicitly enabled)
        env:
          FINAM_API_SECRET: ${{ secrets.FINAM_API_SECRET }}
          FINAM_ACCOUNT_ID: ${{ secrets.FINAM_ACCOUNT_ID }}
        run: python futures_executor.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-trade-log
          path: futures_signals.csv
          if-no-files-found: warn
