name: MOEX Agent V1 Historical Paper Validation

on:
  push:
    branches: [experiment/moex-agent-v1-paper]
    paths:
      - '.github/workflows/moex-agent-v1-history-backtest.yml'
      - 'research/moex-agent-v1/**'
  workflow_dispatch:
    inputs:
      days:
        description: "Calendar days of free MOEX ISS 1-minute history"
        required: true
        default: "30"
        type: choice
        options:
          - "10"
          - "30"
          - "60"

permissions:
  contents: read

concurrency:
  group: moex-agent-v1-history-backtest
  cancel-in-progress: false

jobs:
  historical-paper-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated experiment
        uses: actions/checkout@v4
        with:
          ref: experiment/moex-agent-v1-paper

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/moex-agent-v1/requirements.txt

      - name: Install official Russian NCA certificates for MOEX
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/local/share/ca-certificates/moex-nca
          declare -A cert_urls=(
            [root]="https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt"
            [sub]="https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt"
          )
          for name in root sub; do
            src="/tmp/moex-nca-$name.crt"
            dst="/usr/local/share/ca-certificates/moex-nca/$name.crt"
            curl --fail --location --silent --show-error "${cert_urls[$name]}" --output "$src"
            test "$(wc -c < "$src")" -gt 500
            openssl x509 -in "$src" -noout -subject
            sudo install -m 0644 "$src" "$dst"
          done
          sudo update-ca-certificates
          echo "REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"

      - name: Fetch pinned upstream agent
        run: |
          git clone https://github.com/omnistrateg-ux/moex-agent.git vendor/moex-agent
          git -C vendor/moex-agent checkout 5b8a3e56c933a85554feb7496fb251ac95ced1a6
          test -f vendor/moex-agent/models/meta.json
          test -f vendor/moex-agent/models/model_time_5m.joblib

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r research/moex-agent-v1/requirements.txt

      - name: Prepare isolated config and direction-correct backtest
        run: |
          cp research/moex-agent-v1/config.yaml vendor/moex-agent/config.yaml
          python research/moex-agent-v1/patch_direction.py

      - name: Initialize paper database
        working-directory: vendor/moex-agent
        run: python -m moex_agent --config config.yaml init-db

      - name: Download recent MOEX ISS history
        working-directory: vendor/moex-agent
        run: |
          DAYS="${{ inputs.days }}"
          if [ -z "$DAYS" ]; then DAYS=30; fi
          PYTHONPATH="$PWD" python "$GITHUB_WORKSPACE/research/moex-agent-v1/bootstrap_history.py" --days "$DAYS" --workers 8

      - name: Validate historical data quality
        working-directory: vendor/moex-agent
        run: |
          DAYS="${{ inputs.days }}"
          if [ -z "$DAYS" ]; then DAYS=30; fi
          PYTHONPATH="$PWD" python "$GITHUB_WORKSPACE/research/moex-agent-v1/validate_history.py" --days "$DAYS"

      - name: Run direction-correct historical paper backtest
        working-directory: vendor/moex-agent
        run: |
          DAYS="${{ inputs.days }}"
          if [ -z "$DAYS" ]; then DAYS=30; fi
          PYTHONPATH="$PWD" python "$GITHUB_WORKSPACE/research/moex-agent-v1/run_backtest_report.py" --days "$DAYS"

      - name: Upload historical paper results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moex-agent-v1-history-backtest-${{ github.run_number }}
          path: |
            vendor/moex-agent/data/moex_agent.sqlite
            vendor/moex-agent/data/history_quality.json
            vendor/moex-agent/data/backtest_summary.json
            vendor/moex-agent/data/backtest_trades.csv
          if-no-files-found: warn
          retention-days: 14
