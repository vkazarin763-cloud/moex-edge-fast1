name: SMA50 exit robustness — development folds
on:
  push:
    branches:
      - research/price-forecast-24h-v1
    paths:
      - "research_agent/price_forecast_24h/evaluate_sma50_exit_robustness.py"
      - ".github/workflows/sma50-exit-robustness.yml"
permissions:
  contents: write
concurrency:
  group: sma50-exit-robustness
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/price-forecast-24h-v1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile research_agent/price_forecast_24h/evaluate_sma50_exit_robustness.py
      - name: Evaluate exits on development folds only
        run: python -m research_agent.price_forecast_24h.evaluate_sma50_exit_robustness
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_agent/price_forecast_24h/reports/sma50-exit-robustness-*
          git commit -m "research: SMA50 exit robustness on development folds"
          git push origin HEAD:research/price-forecast-24h-v1
      - uses: actions/upload-artifact@v4
        with:
          name: sma50-exit-robustness
          path: research_agent/price_forecast_24h/reports/sma50-exit-robustness-*
          retention-days: 30
