name: Volatility filter robustness and holdout
on:
  push:
    branches:
      - research/price-forecast-24h-v1
    paths:
      - "research_agent/price_forecast_24h/evaluate_volatility_robustness.py"
      - ".github/workflows/volatility-filter-robustness.yml"
permissions:
  contents: write
concurrency:
  group: price-forecast-24h-research-write
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/price-forecast-24h-v1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile research_agent/price_forecast_24h/evaluate_volatility_robustness.py
      - name: Evaluate frozen candidate and untouched holdout
        run: python -m research_agent.price_forecast_24h.evaluate_volatility_robustness
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_agent/price_forecast_24h/reports/volatility-filter-robustness-*
          git commit -m "research: validate volatility filter robustness and holdout"
          git pull --rebase origin research/price-forecast-24h-v1
          git push origin HEAD:research/price-forecast-24h-v1
      - uses: actions/upload-artifact@v4
        with:
          name: volatility-filter-robustness
          path: research_agent/price_forecast_24h/reports/volatility-filter-robustness-*
          retention-days: 30
