name: Equities Research Agent (Source Inspection + Offline Donchian Replay)

on:
  push:
    branches:
      - feature/external-strategy-research-v1
  schedule:
    - cron: '17 5 * * 1-5'
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum source leads per source; equities only (1–10)"
        required: true
        type: number
        default: 5

permissions:
  contents: read
  actions: read

concurrency:
  group: external-strategy-source-scout
  cancel-in-progress: false

jobs:
  source-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected development branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run offline tests
        run: |
          python -m compileall -q research_agent tests
          python -m unittest tests.test_external_strategy_scout tests.test_equities_strategy_research_agent tests.test_moex_equities_donchian_replay -v
      - name: Download frozen MOEX 44 historical snapshot
        uses: actions/download-artifact@v4
        with:
          name: moex-edge-multi-timeframe-candles
          path: moex_data
          repository: ${{ github.repository }}
          run-id: 44861047844
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run split-adjusted Donchian 20/10 research replay
        run: |
          python -m research_agent.moex_equities_donchian_replay --input moex_data/moex_edge_multi_timeframe_candles.json --output moex_donchian_20_10_replay.json
      - name: Discover, read and extract public equities strategy sources
        run: |
          python -m research_agent.equities_strategy_research_agent --limit "${{ inputs.limit || 5 }}" --output equities_strategy_research.json
      - name: Publish safe summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('equities_strategy_research.json')
          lines = ['# MOEX EDGE equities strategy research agent', '']
          if path.exists():
              data = json.loads(path.read_text(encoding='utf-8'))
              lines += [f"- Status: {data.get('status')}", f"- Unique source leads: {data.get('candidate_count')}", f"- Source errors: {len(data.get('discovery_errors', []))}", f"- Status counts: {data.get('status_counts')}", '', '## Sources']
              for item in data.get('candidates', []):
                  lines.append(f"- [{item.get('title')}]({item.get('url')}) — {item.get('inspection_status')}; missing: {', '.join(item.get('missing_rule_fields', [])) or 'none'}; files: {', '.join(item.get('inspected_files', []))}")
              lines += ['', 'Source inspection is evidence collection, not AI validation or profitability evidence. All candidates remain NOT_ELIGIBLE until independent MOEX testing. The separate MOEX replay uses only the frozen historical artifact and is a trade-level diagnostic; no live signals, broker accounts or orders are accessed.']
          else:
              lines.append('No source report was produced; inspect the failed step logs.')
          replay_path = Path('moex_donchian_20_10_replay.json')
          if replay_path.exists():
              replay = json.loads(replay_path.read_text(encoding='utf-8'))
              lines += ['', '## MOEX Donchian 20/10 — trade-level diagnostic',
                        f"- Closed trades: {replay['summary']['closed_trades']}",
                        f"- Open positions at cutoff: {replay['summary']['open_positions_at_cutoff']}",
                        f"- D1 bars before holdout: {replay['data_validation']['total_d1_bars_before_holdout']}",
                        f"- Data validation errors: duplicates={replay['data_validation']['duplicates']}, non_monotonic={replay['data_validation']['non_monotonic']}, invalid_ohlc={replay['data_validation']['invalid_ohlc']}"]
              for item in replay['summary']['trade_metrics_by_cost_scenario']:
                  lines.append(f"- {item['cost_bps_per_side']} bps/side: avg={item.get('average_net_trade_return', 0):.4%}; PF={item.get('profit_factor')}; win={item.get('win_rate', 0):.1%}")
              lines.append('Trade-level diagnostic only; not portfolio returns, not scanner approval. Holdout bars remain excluded.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\n'.join(lines) + '\n')
          PY
      - name: Upload equities research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equities-research-pilot-${{ github.run_id }}
          path: |
            equities_strategy_research.json
            moex_donchian_20_10_replay.json
          if-no-files-found: warn
          retention-days: 14