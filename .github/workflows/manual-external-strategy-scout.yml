name: Manual External Strategy Source Scout (Metadata Only)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum source leads per market and source (1–10)"
        required: true
        type: number
        default: 5

permissions:
  contents: read

concurrency:
  group: external-strategy-source-scout
  cancel-in-progress: false

jobs:
  source-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout selected development branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run offline tests
        run: |
          python -m compileall -q research_agent tests
          python -m unittest tests.test_external_strategy_scout -v
      - name: Discover public source metadata only
        run: |
          python -m research_agent.external_strategy_scout --limit "${{ inputs.limit }}" --output external_strategy_sources.json
      - name: Publish safe summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('external_strategy_sources.json')
          lines = ['# External strategy source scout — metadata only', '']
          if path.exists():
              data = json.loads(path.read_text(encoding='utf-8'))
              lines += [f"- Status: {data.get('status')}", f"- Unique source leads: {data.get('candidate_count')}", f"- Source errors: {len(data.get('errors', []))}", f"- Mode: {data.get('mode')}", '', '## Sources']
              for item in data.get('candidates', []):
                  lines.append(f"- [{item.get('title')}]({item.get('url')}) — {', '.join(item.get('market_tags', []))}; {item.get('source_type')}; license: {item.get('license_status')}")
              lines += ['', 'Search results are unverified leads, not tested strategies. No market data, signals, backtests, broker accounts or orders were accessed.']
          else:
              lines.append('No report was produced; inspect the failed step logs.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\n'.join(lines) + '\n')
          PY
      - name: Upload source catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-strategy-source-leads-${{ github.run_id }}
          path: external_strategy_sources.json
          if-no-files-found: warn
          retention-days: 14
