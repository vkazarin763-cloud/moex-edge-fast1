name: MOEX EDGE Finam Candle Cross-check (Manual, Read Only)

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "Start date YYYY-MM-DD (blank = 30 days ending previous Moscow day)"
        required: false
        type: string
      date_till:
        description: "End date YYYY-MM-DD (blank = previous Moscow day)"
        required: false
        type: string
      tickers:
        description: "Comma-separated MOEX tickers"
        required: false
        default: "AFKS,AFLT,ALRS,BSPB,CBOM,CHMF,CNRU,DOMRF,ENPG,FLOT,GAZP,GMKN,HEAD,IRAO,LKOH,MAGN,MDMG,MOEX,MTSS,NLMK,NVTK,OZON,PHOR,PLZL,POSI,RAGR,RENI,ROSN,RTKM,RUAL,SBER,SBERP,SNGS,SNGSP,SVCB,T,TATN,TATNP,TRNFP,UGLD,VKCO,VTBR,X5,YDEX"
        type: string

permissions:
  contents: read

concurrency:
  group: moex-edge-finam-crosscheck
  cancel-in-progress: false

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve and validate date range
        id: dates
        env:
          INPUT_FROM: ${{ github.event.inputs.date_from }}
          INPUT_TILL: ${{ github.event.inputs.date_till }}
        run: |
          export INPUT_FROM INPUT_TILL
          python - <<'PY'
          import os
          from datetime import date, datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          moscow_today = datetime.now(ZoneInfo('Europe/Moscow')).date()
          raw_end = os.environ['INPUT_TILL']
          raw_start = os.environ['INPUT_FROM']
          end = date.fromisoformat(raw_end) if raw_end else moscow_today - timedelta(days=1)
          start = date.fromisoformat(raw_start) if raw_start else end - timedelta(days=29)
          if raw_end and end.isoformat() != raw_end:
              raise SystemExit('date_till must use YYYY-MM-DD')
          if raw_start and start.isoformat() != raw_start:
              raise SystemExit('date_from must use YYYY-MM-DD')
          if start > end:
              raise SystemExit('date_from must not be after date_till')
          if (end - start).days + 1 > 365:
              raise SystemExit('Finam D1 history is limited to 365 calendar dates')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'date_from={start.isoformat()}\n')
              output.write(f'date_till={end.isoformat()}\n')
          PY
      - name: Verify Finam credential is configured (never print its value)
        env:
          FINAM_API_TOKEN: ${{ secrets.FINAM_API_TOKEN }}
        run: |
          if [ -z "${FINAM_API_TOKEN:-}" ]; then
            echo "Repository Actions secret FINAM_API_TOKEN is not configured."
            exit 1
          fi
          echo "Finam API token is configured."
      - name: Run read-only D1 candle cross-check
        env:
          FINAM_API_TOKEN: ${{ secrets.FINAM_API_TOKEN }}
          FINAM_SOURCE_APP_ID: ${{ secrets.FINAM_SOURCE_APP_ID }}
          DATE_FROM: ${{ steps.dates.outputs.date_from }}
          DATE_TILL: ${{ steps.dates.outputs.date_till }}
          TICKERS: ${{ github.event.inputs.tickers || 'AFKS,AFLT,ALRS,BSPB,CBOM,CHMF,CNRU,DOMRF,ENPG,FLOT,GAZP,GMKN,HEAD,IRAO,LKOH,MAGN,MDMG,MOEX,MTSS,NLMK,NVTK,OZON,PHOR,PLZL,POSI,RAGR,RENI,ROSN,RTKM,SBER,SBERP,SNGS,SNGSP,SVCB,T,TATN,TATNP,TRNFP,UGLD,VKCO,VTBR,X5,YDEX' }}
        run: |
          python -m research_agent.finam_crosscheck \
            --from "$DATE_FROM" \
            --till "$DATE_TILL" \
            --tickers "$TICKERS" \
            --output finam_moex_crosscheck.json
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finam-moex-daily-crosscheck
          path: finam_moex_crosscheck.json
          if-no-files-found: warn
          retention-days: 30
