name: MOEX EDGE Finam Candle Cross-check (Manual, Read Only)

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "Start date YYYY-MM-DD (blank = 30 days ago)"
        required: false
        type: string
      date_till:
        description: "End date YYYY-MM-DD (blank = today UTC)"
        required: false
        type: string
      tickers:
        description: "Comma-separated MOEX tickers"
        required: false
        default: "SBER,GAZP,LKOH,VTBR,T"
        type: string

permissions:
  contents: read

concurrency:
  group: moex-edge-finam-crosscheck
  cancel-in-progress: false

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve and validate date range
        id: dates
        env:
          INPUT_FROM: ${{ github.event.inputs.date_from }}
          INPUT_TILL: ${{ github.event.inputs.date_till }}
        run: |
          END="${INPUT_TILL:-$(date -u +%F)}"
          START="${INPUT_FROM:-$(date -u -d '30 days ago' +%F)}"
          export START END
          python - <<'PY'
          import os
          from datetime import date
          from pathlib import Path

          start = date.fromisoformat(os.environ["START"])
          end = date.fromisoformat(os.environ["END"])
          if start.isoformat() != os.environ["START"] or end.isoformat() != os.environ["END"]:
              raise SystemExit("Dates must use YYYY-MM-DD")
          if start > end:
              raise SystemExit("date_from must not be after date_till")
          if (end - start).days + 1 > 365:
              raise SystemExit("Finam D1 history is limited to 365 calendar dates")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"date_from={start.isoformat()}\n")
              output.write(f"date_till={end.isoformat()}\n")
          PY
      - name: Verify Finam credential is configured (never print its value)
        env:
          FINAM_API_TOKEN: ${{ secrets.FINAM_API_TOKEN }}
        run: |
          if [ -z "${FINAM_API_TOKEN:-}" ]; then
            echo "Repository Actions secret FINAM_API_TOKEN is not configured."
            exit 1
          fi
          echo "Finam API token is configured."
      - name: Run read-only daily candle cross-check
        env:
          FINAM_API_TOKEN: ${{ secrets.FINAM_API_TOKEN }}
          FINAM_SOURCE_APP_ID: ${{ secrets.FINAM_SOURCE_APP_ID }}
          DATE_FROM: ${{ steps.dates.outputs.date_from }}
          DATE_TILL: ${{ steps.dates.outputs.date_till }}
          TICKERS: ${{ github.event.inputs.tickers || 'SBER,GAZP,LKOH,VTBR,T' }}
        run: |
          python -m research_agent.finam_crosscheck \
            --from "$DATE_FROM" \
            --till "$DATE_TILL" \
            --tickers "$TICKERS" \
            --output finam_moex_crosscheck.json
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finam-moex-daily-crosscheck
          path: finam_moex_crosscheck.json
          if-no-files-found: warn
          retention-days: 30
