name: MOEX EDGE FAST (Hourly Trading)

permissions:
  contents: write

# Serialize scanner+executor with manual executor runs to protect the durable signal journal.
concurrency:
  group: finam-executor-account
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    # Signal scanning may continue, but live broker execution is disabled below.
    - cron: "0 4-20 * * 1-5"
    - cron: "0 7-16 * * 6,0"

jobs:
  scan_and_execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests numpy

      - name: Run Scanner (Find Signals)
        run: python moex_edge_fast_33.py

      - name: Run Finam Executor (DRY RUN ONLY — LIVE TRADING DISABLED)
        env:
          FINAM_API_SECRET: ${{ secrets.FINAM_API_SECRET }}
          FINAM_ACCOUNT_ID: ${{ secrets.FINAM_ACCOUNT_ID }}
          FINAM_DRY_RUN: 'true'
          FINAM_LIVE_TRADING_ENABLED: 'false'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          FINAM_STATE_BRANCH: ${{ github.ref_name }}
        run: python finam_executor.py

      - name: Upload signals log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moex-signals-log
          path: moex_signals.csv
          if-no-files-found: warn
