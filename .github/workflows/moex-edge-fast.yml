name: MOEX EDGE FAST (Hourly Trading)

on:
  workflow_dispatch:
  schedule:
    # Будние дни (ПН-ПТ): Запуск каждый час с 04:00 до 20:00 UTC (с 07:00 до 23:00 МСК)
    - cron: "0 4-20 * * 1-5"
    # Выходные (СБ-ВС): Запуск каждый час с 07:00 до 16:00 UTC (с 10:00 до 19:00 МСК)
    - cron: "0 7-16 * * 6,0"

jobs:
  scan_and_execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: pip install pandas requests numpy
        
      - name: Run Scanner (Find Signals)
        run: python moex_edge_fast_33.py
        
      - name: Run Finam Executor (Place Orders)
        env:
          FINAM_API_SECRET: ${{ secrets.FINAM_API_SECRET }}
          FINAM_ACCOUNT_ID: ${{ secrets.FINAM_ACCOUNT_ID }}
        run: python finam_executor.py
        
      - name: Upload signals log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moex-signals-log
          path: moex_signals.csv
          if-no-files-found: warn
