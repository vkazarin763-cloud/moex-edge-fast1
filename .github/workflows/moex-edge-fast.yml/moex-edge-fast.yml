
name: MOEX EDGE FAST

on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy ipython

      - name: Configure scanner for GitHub Actions
        env:
          FINAM_API_SECRET: ${{ secrets.FINAM_API_SECRET }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("moex_edge_fast_33.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace("import sys\n", "import os\nimport sys\n", 1)
          old = '    return getpass("Finam API Secret (ввод скрыт): ").strip()'
          new = '    return os.environ["FINAM_API_SECRET"].strip()'
          if old not in s:
              raise SystemExit("Не найден участок get_secret для настройки")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run scanner
        env:
          FINAM_API_SECRET: ${{ secrets.FINAM_API_SECRET }}
        run: python moex_edge_fast_33.py

      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moex-edge-fast-reports
          path: "*.csv"
          if-no-files-found: warn
          
