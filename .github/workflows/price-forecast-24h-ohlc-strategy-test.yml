name: Price Forecast 24H — OHLC strategy research

on:
  push:
    branches:
      - research/price-forecast-24h-v1
    paths:
      - "research_agent/price_forecast_24h/evaluate_ohlc_strategies.py"

permissions:
  contents: write

concurrency:
  group: price-forecast-24h-ohlc-strategies
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/price-forecast-24h-v1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile strategy evaluator
        run: python -m py_compile research_agent/price_forecast_24h/evaluate_ohlc_strategies.py
      - name: Run OHLC strategy backtest
        run: python -m research_agent.price_forecast_24h.evaluate_ohlc_strategies
      - name: Commit report to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_agent/price_forecast_24h/reports/ohlc-strategy-test-*
          git commit -m "research: add OHLC strategy test report"
          git push origin HEAD:research/price-forecast-24h-v1
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: price-forecast-24h-ohlc-strategy-test
          path: |
            research_agent/price_forecast_24h/reports/ohlc-strategy-test-*
          retention-days: 30
