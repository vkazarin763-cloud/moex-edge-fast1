name: Indicator optimizer tests

on:
  push:
    branches:
      - research/indicator-optimizer-v1
    paths:
      - "research/indicator_optimizer/**"
      - ".github/workflows/indicator-optimizer-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/indicator-optimizer-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/indicator_optimizer/requirements.txt
      - name: Install dependencies
        run: pip install -r research/indicator_optimizer/requirements.txt
      - name: Run unit tests
        working-directory: research/indicator_optimizer
        run: python -m unittest -v
