name: MOEX Agent V1 Paper

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "5 4-15 * * 1-5"

permissions:
  contents: read

concurrency:
  group: moex-agent-v1-paper
  cancel-in-progress: false

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated experiment
        uses: actions/checkout@v4
        with:
          ref: experiment/moex-agent-v1-paper

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/moex-agent-v1/requirements.txt

      - name: Install official Russian NCA certificates for MOEX
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, unquote
          from urllib.request import Request, urlopen
          import re

          source = "https://www.gosuslugi.ru/landing/crt"
          request = Request(source, headers={"User-Agent": "Mozilla/5.0 MOEX-Agent-CI"})
          with urlopen(request, timeout=30) as response:
              html = response.read().decode("utf-8", errors="replace")

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.hrefs.append(href)

          parser = Links()
          parser.feed(html)
          wanted = {
              "root": re.compile(r"Russian[_ -]Trusted[_ -]Root[_ -]CA\\.(?:cer|crt|pem)$", re.I),
              "sub": re.compile(r"Russian[_ -]Trusted[_ -]Sub[_ -]CA\\.(?:cer|crt|pem)$", re.I),
              "sub2024": re.compile(r"Russian[_ -]Trusted[_ -]Sub[_ -]CA[_ -]2024\\.(?:cer|crt|pem)$", re.I),
          }
          found = {}
          for href in parser.hrefs:
              absolute = urljoin(source, href)
              parsed = urlparse(absolute)
              if parsed.scheme != "https":
                  continue
              filename = Path(unquote(parsed.path)).name
              for key, pattern in wanted.items():
                  if key not in found and pattern.search(filename):
                      found[key] = absolute

          if set(found) != set(wanted):
              print("Official Gosuslugi certificate links discovered:")
              for href in parser.hrefs:
                  if re.search(r"trusted|\\.cer|\\.crt|\\.pem", href, re.I):
                      print(urljoin(source, href))
              raise SystemExit("Could not identify all 3 official NCA certificates; refusing to continue.")

          out = Path("/tmp/moex-nca")
          out.mkdir(parents=True, exist_ok=True)
          for key, url in found.items():
              req = Request(url, headers={"User-Agent": "Mozilla/5.0 MOEX-Agent-CI"})
              with urlopen(req, timeout=30) as response:
                  data = response.read()
              if len(data) < 500:
                  raise SystemExit(f"Certificate download unexpectedly small: {key}")
              (out / f"{key}.download").write_bytes(data)
              print(f"Downloaded {key} certificate from the official Gosuslugi certificate page.")
          PY

          sudo mkdir -p /usr/local/share/ca-certificates/moex-nca
          for name in root sub sub2024; do
            src="/tmp/moex-nca/$name.download"
            dst="/usr/local/share/ca-certificates/moex-nca/$name.crt"
            if openssl x509 -in "$src" -noout >/dev/null 2>&1; then
              sudo cp "$src" "$dst"
            else
              openssl x509 -inform DER -in "$src" -out "/tmp/$name.crt"
              sudo cp "/tmp/$name.crt" "$dst"
            fi
            openssl x509 -in "$dst" -noout -subject
          done
          sudo update-ca-certificates
          echo "REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"

      - name: Verify MOEX ISS TLS and API access
        run: |
          python - <<'PY'
          import requests
          url = "https://iss.moex.com/iss/engines/stock/markets/shares/boards/TQBR/securities/SBER.json?iss.meta=off"
          response = requests.get(url, timeout=25)
          response.raise_for_status()
          payload = response.json()
          if "securities" not in payload:
              raise SystemExit("MOEX ISS response did not contain the securities block.")
          print("MOEX ISS TLS verified; SBER endpoint returned HTTP", response.status_code)
          PY

      - name: Fetch pinned upstream agent
        run: |
          git clone https://github.com/omnistrateg-ux/moex-agent.git vendor/moex-agent
          git -C vendor/moex-agent checkout 5b8a3e56c933a85554feb7496fb251ac95ced1a6
          test -f vendor/moex-agent/models/meta.json
          test -f vendor/moex-agent/models/model_time_5m.joblib

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r research/moex-agent-v1/requirements.txt

      - name: Prepare isolated config and correct directional probability
        run: |
          cp research/moex-agent-v1/config.yaml vendor/moex-agent/config.yaml
          python research/moex-agent-v1/patch_direction.py

      - name: Initialize paper database
        working-directory: vendor/moex-agent
        run: python -m moex_agent --config config.yaml init-db

      - name: Run one paper cycle
        working-directory: vendor/moex-agent
        run: python -m moex_agent --config config.yaml live --once

      - name: Upload paper results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moex-agent-v1-paper-${{ github.run_number }}
          path: |
            vendor/moex-agent/data/moex_agent.sqlite
            vendor/moex-agent/models/meta.json
          if-no-files-found: warn
          retention-days: 14
