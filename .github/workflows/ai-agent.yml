name: AI Virtual Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7-20 * * 1-5"   # Агент: каждый час
    - cron: "0 7-16 * * 6,0"   # Агент: каждый час в выходные
    - cron: "0 20 * * 0"       # Тренер: раз в неделю (Вс, 23:00 МСК)

permissions:
  contents: write

jobs:
  run_agent:
    if: github.event.schedule != '0 20 * * 0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas requests numpy
      - name: Run Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ai_agent.py
      - name: Commit portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add ai_portfolio.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update AI portfolio [skip ci]" && git push)

  train_agent:
    if: github.event.schedule == '0 20 * * 0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas requests numpy
      - name: Run Trainer
        run: python ai_trainer.py
      - name: Commit weights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add ai_weights.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update AI weights [skip ci]" && git push)
