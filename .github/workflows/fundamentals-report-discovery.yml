name: Fundamentals — free MOEX report discovery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moex-fundamentals-report-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/price-forecast-24h-v1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run read-only public report discovery
        run: python -m research_agent.fundamentals.collector
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_fundamentals_collector.py' -v
      - name: Commit report metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_agent/fundamentals/data/
          if git diff --cached --quiet; then
            echo "No new report metadata."
            exit 0
          fi
          git commit -m "research: update public issuer report discovery"
          git push origin HEAD:research/price-forecast-24h-v1
      - name: Upload discovery snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moex-fundamentals-report-discovery
          path: research_agent/fundamentals/data/*.json
          if-no-files-found: warn
          retention-days: 30
