name: Indicator optimizer research

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2025-01-01"
      fee:
        description: "Round-trip commission fraction (0.0026 = 0.26%)"
        required: true
        default: "0.0026"
      slippage:
        description: "Round-trip slippage fraction sensitivity (0.001 = 0.10%)"
        required: true
        default: "0.001"
  push:
    branches:
      - research/indicator-optimizer-v1

permissions:
  contents: read

jobs:
  optimize:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[optimizer-smoke]') || contains(github.event.head_commit.message, '[optimizer-full]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/indicator-optimizer-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/indicator_optimizer/requirements.txt
      - name: Install research dependencies
        run: pip install -r research/indicator_optimizer/requirements.txt
      - name: Diagnose HTTPS trust configuration
        run: |
          python - <<'PY'
          import os, pathlib, ssl
          print("Default SSL paths:", ssl.get_default_verify_paths())
          for key in ("REQUESTS_CA_BUNDLE", "CURL_CA_BUNDLE", "SSL_CERT_FILE", "NODE_EXTRA_CA_CERTS"):
              value = os.environ.get(key)
              print(f"{key}: {'configured' if value else 'unset'}; file_exists={bool(value and pathlib.Path(value).is_file())}")
          for key in ("HTTPS_PROXY", "HTTP_PROXY", "ALL_PROXY"):
              print(f"{key}: {'configured' if os.environ.get(key) else 'unset'}")
          PY
          curl --silent --show-error --max-time 15 -o /dev/null -w "MOEX via default route HTTP %{http_code}\n" https://iss.moex.com/iss/index.json || true
          curl --noproxy '*' --silent --show-error --max-time 15 -o /dev/null -w "MOEX direct route HTTP %{http_code}\n" https://iss.moex.com/iss/index.json || true
      - name: Smoke test (three shares, real MOEX ISS candles)
        if: contains(github.event.head_commit.message, '[optimizer-smoke]')
        run: |
          MOEX_ISS_DIRECT=1 python research/indicator_optimizer/optimizer.py \
            --start "2025-01-01" \
            --tickers SBER GAZP LKOH \
            --intervals 10 60 \
            --output optimizer_output
      - name: Full optimizer (all 44 shares)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[optimizer-full]')
        run: |
          python research/indicator_optimizer/optimizer.py \
            --start "${{ inputs.start || '2025-01-01' }}" \
            --fee "${{ inputs.fee || '0.0026' }}" \
            --slippage "${{ inputs.slippage || '0.001' }}" \
            --output optimizer_output
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moex-indicator-optimizer-${{ github.run_id }}
          path: optimizer_output/
          if-no-files-found: warn
          retention-days: 30
