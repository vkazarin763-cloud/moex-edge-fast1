name: Indicator optimizer research

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2025-01-01"
      fee:
        description: "Round-trip commission fraction (0.0026 = 0.26%)"
        required: true
        default: "0.0026"
      slippage:
        description: "Round-trip slippage fraction sensitivity (0.001 = 0.10%)"
        required: true
        default: "0.001"
  push:
    branches:
      - research/indicator-optimizer-v1

permissions:
  contents: read

jobs:
  optimize:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[optimizer-smoke]') || contains(github.event.head_commit.message, '[optimizer-full]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/indicator-optimizer-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/indicator_optimizer/requirements.txt
      - name: Install research dependencies
        run: pip install -r research/indicator_optimizer/requirements.txt
      - name: Smoke test (three shares, real MOEX ISS candles)
        if: contains(github.event.head_commit.message, '[optimizer-smoke]')
        run: |
          python research/indicator_optimizer/optimizer.py \
            --start "2025-01-01" \
            --tickers SBER GAZP LKOH \
            --intervals 10 60 \
            --output optimizer_output
      - name: Full optimizer (all 44 shares)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[optimizer-full]')
        run: |
          python research/indicator_optimizer/optimizer.py \
            --start "${{ inputs.start || '2025-01-01' }}" \
            --fee "${{ inputs.fee || '0.0026' }}" \
            --slippage "${{ inputs.slippage || '0.001' }}" \
            --output optimizer_output
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moex-indicator-optimizer-${{ github.run_id }}
          path: optimizer_output/
          if-no-files-found: warn
          retention-days: 30
