name: Autonomous Experimental Portfolio (Paper Only)

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      years:
        description: "Historical window in years (1-10)"
        required: false
        default: "3"
        type: string
  push:
    branches: [main]
    paths:
      - "experimental_portfolio/engine.py"
      - "experimental_portfolio/agents.py"
      - "experimental_portfolio/paper.py"
      - "experimental_portfolio/run.py"
      - "experimental_portfolio/eligibility.py"
      - "experimental_portfolio/refresh_finam_allowlist.py"
      - "scripts/probe_finam_active_asset_catalog.py"
      - "scripts/probe_finam_active_asset_catalog.py"
      - "experimental_portfolio/finam_allowlist.json"
      - "experimental_portfolio/README.md"
      - "experimental_portfolio/refresh_finam_allowlist.py"
      - ".github/workflows/experimental-portfolio.yml"

permissions:
  contents: write

concurrency:
  group: experimental-paper-portfolio
  cancel-in-progress: false

jobs:
  paper-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe Finam active asset catalog (read-only)
        env:
          FINAM_API_SECRET: ${{ secrets.FINAM_API_SECRET }}
        run: python scripts/probe_finam_active_asset_catalog.py || echo "Catalog probe unavailable; eligibility refresh remains fail-closed."
      - name: Refresh account-specific Finam ETF buy eligibility (read-only)
        env:
          FINAM_API_SECRET: ${{ secrets.FINAM_API_SECRET }}
          FINAM_ACCOUNT_ID: ${{ secrets.FINAM_ACCOUNT_ID }}
        run: python experimental_portfolio/refresh_finam_allowlist.py || echo "Refresh failed safely; empty allowlist/cash-only mode."
      - name: Run deterministic global ETF paper portfolio and AI reviewers
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_MODEL: "openrouter/free"
          GROQ_MODEL: "openai/gpt-oss-20b"
          YEARS: ${{ github.event.inputs.years || '3' }}
        run: |
          python -m experimental_portfolio.run --years "$YEARS"
      - name: Upload portfolio report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-portfolio-${{ github.run_id }}
          path: |
            reports/experimental-portfolio/
            experimental_portfolio/state.json
            experimental_portfolio/paper_ledger.json
            experimental_portfolio/finam_allowlist.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist paper state and reports
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental_portfolio/state.json experimental_portfolio/paper_ledger.json reports/experimental-portfolio/
          if git diff --cached --quiet; then
            echo "No portfolio state or report changes to commit."
          else
            git commit -m "Update experimental forward paper portfolio"
            git push
          fi
