name: Price Forecast 24H — model comparison

on:
  push:
    branches:
      - research/price-forecast-24h-v1
    paths:
      - "research_agent/price_forecast_24h/compare_models_walk_forward.py"
      - ".github/workflows/price-forecast-24h-model-comparison.yml"

permissions:
  contents: write

concurrency:
  group: price-forecast-24h-model-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/price-forecast-24h-v1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile evaluator
        run: python -m py_compile research_agent/price_forecast_24h/compare_models_walk_forward.py
      - name: Run four-fold model comparison
        run: python -m research_agent.price_forecast_24h.compare_models_walk_forward
      - name: Commit report to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_agent/price_forecast_24h/reports/
          git commit -m "research: compare simple 24-bar forecast models" || echo "No report changes"
          git push origin HEAD:research/price-forecast-24h-v1
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: price-forecast-24h-model-comparison
          path: research_agent/price_forecast_24h/reports/model-comparison-*
          retention-days: 30
