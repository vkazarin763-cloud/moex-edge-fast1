name: H1 market regime attribution
on:
  push:
    branches:
      - research/price-forecast-24h-v1
    paths:
      - "research_agent/price_forecast_24h/evaluate_market_regime_attribution.py"
      - ".github/workflows/market-regime-attribution.yml"
permissions:
  contents: write
concurrency:
  group: price-forecast-24h-research-write
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/price-forecast-24h-v1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile research_agent/price_forecast_24h/evaluate_market_regime_attribution.py
      - name: Attribute results to trailing market regimes
        run: python -m research_agent.price_forecast_24h.evaluate_market_regime_attribution
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_agent/price_forecast_24h/reports/market-regime-attribution-*
          git commit -m "research: report H1 market regime attribution"
          git pull --rebase origin research/price-forecast-24h-v1
          git push origin HEAD:research/price-forecast-24h-v1
      - uses: actions/upload-artifact@v4
        with:
          name: market-regime-attribution
          path: research_agent/price_forecast_24h/reports/market-regime-attribution-*
          retention-days: 30
