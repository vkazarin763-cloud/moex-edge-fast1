name: Finam Executor — DRY_RUN only

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finam-executor-account
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only Finam preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only audit dependency
        run: python -m pip install requests
      - name: Verify Finam account and instrument permissions (no orders)
        env:
          FINAM_API_SECRET: ${{ secrets.FINAM_API_SECRET }}
          FINAM_ACCOUNT_ID: ${{ secrets.FINAM_ACCOUNT_ID }}
        run: python finam_readonly_audit.py

  execute:
    name: Run executor in DRY_RUN only
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas requests numpy
      - name: Generate fresh MOEX signals
        run: python moex_edge_fast_33.py
      - name: Run Finam Executor (DRY_RUN forced)
        env:
          FINAM_API_SECRET: ${{ secrets.FINAM_API_SECRET }}
          FINAM_ACCOUNT_ID: ${{ secrets.FINAM_ACCOUNT_ID }}
          FINAM_DRY_RUN: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          FINAM_STATE_BRANCH: ${{ github.ref_name }}
        run: python finam_executor.py
      - name: Upload scanner output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-moex-signals-dry-run
          path: moex_signals.csv
          if-no-files-found: warn
          retention-days: 7
