name: Finam Executor — controlled manual run

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "DRY_RUN — без заявок; LIVE_ONE_MIN_LOT — одна реальная заявка минимальным лотом"
        required: true
        type: choice
        default: DRY_RUN
        options:
          - DRY_RUN
          - LIVE_ONE_MIN_LOT

permissions:
  contents: write

concurrency:
  group: finam-executor-account
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only Finam preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only audit dependency
        run: python -m pip install requests
      - name: Verify Finam account and instrument permissions (no orders)
        env:
          FINAM_API_SECRET: ${{ secrets.FINAM_API_SECRET }}
          FINAM_ACCOUNT_ID: ${{ secrets.FINAM_ACCOUNT_ID }}
        run: python finam_readonly_audit.py

  execute:
    name: Execute no more than one minimum-lot order
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas requests numpy
      - name: Generate fresh MOEX signals
        run: python moex_edge_fast_33.py
      - name: Require explicit live-mode opt-in
        if: ${{ inputs.mode == 'LIVE_ONE_MIN_LOT' && vars.FINAM_DRY_RUN != 'false' }}
        run: |
          echo "Live mode requested, but repository variable FINAM_DRY_RUN is not exactly 'false'."
          echo "No broker order was submitted. Keep the variable safe unless the owner deliberately enables the live test."
          exit 1
      - name: Run Finam Executor
        env:
          FINAM_API_SECRET: ${{ secrets.FINAM_API_SECRET }}
          FINAM_ACCOUNT_ID: ${{ secrets.FINAM_ACCOUNT_ID }}
          FINAM_DRY_RUN: ${{ inputs.mode == 'LIVE_ONE_MIN_LOT' && vars.FINAM_DRY_RUN == 'false' && 'false' || 'true' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          FINAM_STATE_BRANCH: ${{ github.ref_name }}
        run: python finam_executor.py
      - name: Upload scanner output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-moex-signals
          path: moex_signals.csv
          if-no-files-found: warn
          retention-days: 7
