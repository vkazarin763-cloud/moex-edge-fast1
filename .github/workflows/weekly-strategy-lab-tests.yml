name: Weekly Strategy Lab Tests
on:
  push:
    paths: ["experimental_portfolio/weekly_strategy_lab.py", "tests/test_weekly_strategy_lab.py", ".github/workflows/weekly-strategy-lab-tests.yml"]
  pull_request:
    paths: ["experimental_portfolio/weekly_strategy_lab.py", "tests/test_weekly_strategy_lab.py", ".github/workflows/weekly-strategy-lab-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest tests.test_weekly_strategy_lab -v
