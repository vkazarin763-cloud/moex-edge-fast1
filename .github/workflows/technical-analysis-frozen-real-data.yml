name: Technical Analysis — Frozen MOEX 44 Data Validation

on:
  push:
    branches:
      - feature/technical-analysis-ready-libraries-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: technical-analysis-frozen-real-data
  cancel-in-progress: false

jobs:
  frozen-real-data-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ta-research.txt
      - name: Install pinned analysis dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ta-research.txt pandas
      - name: Download frozen OHLCV artifact from source run
        uses: actions/download-artifact@v4
        with:
          name: moex-edge-multi-timeframe-candles
          repository: ${{ github.repository }}
          run-id: 44861047844
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: frozen-data
      - name: Verify immutable source files
        run: |
          test -f frozen-data/moex_edge_multi_timeframe_candles.json
          test -f frozen-data/moex_edge_multi_timeframe_validation.json
          echo "8df302ac97b1132fefeae5054ec263ea3d2545f8a5622eef33065ee2fa2d5eee  frozen-data/moex_edge_multi_timeframe_candles.json" | sha256sum --check
          echo "900145ac5c01f80a0ba70535847737761509bfcae4c6a4b7fbb17c4d72646fb2  frozen-data/moex_edge_multi_timeframe_validation.json" | sha256sum --check
      - name: Run real-data analysis with sealed holdout excluded
        run: |
          python -m compileall -q research_agent/technical_analysis_ready.py scripts/run_ta_frozen_moex44.py
          python scripts/run_ta_frozen_moex44.py
      - name: Upload compact analysis report
        uses: actions/upload-artifact@v4
        with:
          name: moex-ta-frozen-44-d1-h1-w1-report
          path: ta-real-data-report/
          if-no-files-found: error
          retention-days: 30
