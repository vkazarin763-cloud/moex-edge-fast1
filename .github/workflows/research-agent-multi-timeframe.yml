name: MOEX EDGE Multi-Timeframe Candles (Read Only)

on:
  push:
    branches: [main]
    paths:
      - "research_agent/multi_timeframe.py"
      - "research_agent/multi_timeframe_validation.py"
      - "research_agent/mtf_scanner.py"
      - "tests/test_research_multi_timeframe.py"
      - "tests/test_research_mtf_scanner.py"
      - ".github/workflows/research-agent-multi-timeframe.yml"
      - ".github/workflows/research-agent-mtf-signals.yml"
  schedule:
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated MOEX tickers (blank = frozen 44-symbol universe)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: moex-edge-multi-timeframe-candles
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Finam credential is configured (never print its value)
        env:
          FINAM_API_TOKEN: ${{ secrets.FINAM_API_TOKEN }}
        run: |
          if [ -z "${FINAM_API_TOKEN:-}" ]; then
            echo "Repository Actions secret FINAM_API_TOKEN is not configured."
            exit 1
          fi
          echo "Finam API token is configured."
      - name: Collect independent timeframe candle series
        env:
          FINAM_API_TOKEN: ${{ secrets.FINAM_API_TOKEN }}
          FINAM_SOURCE_APP_ID: ${{ secrets.FINAM_SOURCE_APP_ID }}
          TICKERS: ${{ github.event.inputs.tickers }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "push" ]; then
            python -m research_agent.multi_timeframe --frames "D1,H1" --output moex_edge_multi_timeframe_candles.json
          elif [ -n "${TICKERS:-}" ]; then
            python -m research_agent.multi_timeframe --tickers "$TICKERS" --output moex_edge_multi_timeframe_candles.json
          else
            python -m research_agent.multi_timeframe --output moex_edge_multi_timeframe_candles.json
          fi
      - name: Validate timestamps and no-lookahead alignment
        run: |
          python -m research_agent.multi_timeframe_validation --input moex_edge_multi_timeframe_candles.json --output moex_edge_multi_timeframe_validation.json
      - name: Upload multi-timeframe candle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moex-edge-multi-timeframe-candles
          path: |
            moex_edge_multi_timeframe_candles.json
            moex_edge_multi_timeframe_validation.json

          if-no-files-found: warn
          retention-days: 30
