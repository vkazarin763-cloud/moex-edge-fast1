name: Finam — direct T SL/TP test (one order only)

on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: "Разрешить одну реальную покупку T минимальным лотом"
        required: true
        type: boolean
        default: false
      confirmation:
        description: "Для реальной сделки введи BUY_T_ONCE; иначе оставь пустым"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: finam-executor-account
  cancel-in-progress: false

jobs:
  direct-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas requests
      - name: Run isolated T protection test
        env:
          FINAM_API_SECRET: ${{ secrets.FINAM_API_SECRET }}
          FINAM_ACCOUNT_ID: ${{ secrets.FINAM_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINAM_DIRECT_TEST_CONFIRM: ${{ inputs.confirmation }}
          FINAM_DRY_RUN: ${{ inputs.confirm_live == true && inputs.confirmation == 'BUY_T_ONCE' && 'false' || 'true' }}
          FINAM_LIVE_TRADING_ENABLED: ${{ inputs.confirm_live == true && inputs.confirmation == 'BUY_T_ONCE' && 'true' || 'false' }}
        run: python finam_direct_t_sltp_test.py
