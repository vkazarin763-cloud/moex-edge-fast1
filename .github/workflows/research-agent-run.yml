name: MOEX EDGE Autonomous Research (Read Only)

on:
  push:
    branches: [main]
    paths:
      - "research_agent/**"
      - ".github/workflows/research-agent-run.yml"
  workflow_dispatch:
    inputs:
      date_from:
        description: "Start date YYYY-MM-DD (blank = rolling 3 years)"
        required: false
        type: string
      date_till:
        description: "End date YYYY-MM-DD (blank = today UTC)"
        required: false
        type: string
  schedule:
    - cron: "30 1 * * 0"

permissions:
  contents: read

concurrency:
  group: moex-edge-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve and validate research date range
        id: dates
        env:
          INPUT_FROM: ${{ github.event.inputs.date_from }}
          INPUT_TILL: ${{ github.event.inputs.date_till }}
        run: |
          END="${INPUT_TILL:-$(date -u +%F)}"
          START="${INPUT_FROM:-$(date -u -d '3 years ago' +%F)}"
          export START END
          python - <<'PY'
          import os
          from datetime import date
          from pathlib import Path

          start = date.fromisoformat(os.environ["START"])
          end = date.fromisoformat(os.environ["END"])
          if start.isoformat() != os.environ["START"] or end.isoformat() != os.environ["END"]:
              raise SystemExit("Dates must use YYYY-MM-DD")
          if start > end:
              raise SystemExit("date_from must not be after date_till")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"date_from={start.isoformat()}\n")
              output.write(f"date_till={end.isoformat()}\n")
          PY
      - name: Run read-only research across MOEX first-listing universe
        env:
          DATE_FROM: ${{ steps.dates.outputs.date_from }}
          DATE_TILL: ${{ steps.dates.outputs.date_till }}
        run: |
          python -m research_agent.cli \
            --from "$DATE_FROM" \
            --till "$DATE_TILL" \
            --output research_report.json
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moex-edge-research-report
          path: |
            research_report.json
            strategy_registry.json
          if-no-files-found: warn
          retention-days: 30
