name: MOEX EDGE Autonomous Research (Read Only)

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "Start date YYYY-MM-DD (blank = rolling 3 years)"
        required: false
        type: string
      date_till:
        description: "End date YYYY-MM-DD (blank = today UTC)"
        required: false
        type: string
  schedule:
    - cron: "30 1 * * 0"

permissions:
  contents: read

concurrency:
  group: moex-edge-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve research date range
        id: dates
        env:
          INPUT_FROM: ${{ github.event.inputs.date_from }}
          INPUT_TILL: ${{ github.event.inputs.date_till }}
        run: |
          END="${INPUT_TILL:-$(date -u +%F)}"
          START="${INPUT_FROM:-$(date -u -d '3 years ago' +%F)}"
          echo "date_from=$START" >> "$GITHUB_OUTPUT"
          echo "date_till=$END" >> "$GITHUB_OUTPUT"
      - name: Run read-only research across MOEX first-listing universe
        run: |
          python -m research_agent.cli \
            --from "${{ steps.dates.outputs.date_from }}" \
            --till "${{ steps.dates.outputs.date_till }}" \
            --output research_report.json
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moex-edge-research-report
          path: research_report.json
          if-no-files-found: warn
          retention-days: 30
