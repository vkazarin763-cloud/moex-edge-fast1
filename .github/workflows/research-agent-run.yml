name: MOEX EDGE Autonomous Research (Finam Only, Read Only)

on:
  push:
    branches: [main]
    paths:
      - "research_agent/**"
      - ".github/workflows/research-agent-run.yml"
      - ".github/workflows/manual-finam-two-strategy-research.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 0"

permissions:
  contents: read

concurrency:
  group: moex-edge-research
  cancel-in-progress: false

jobs:
  finam-only-research:
    uses: ./.github/workflows/manual-finam-two-strategy-research.yml
    secrets: inherit
