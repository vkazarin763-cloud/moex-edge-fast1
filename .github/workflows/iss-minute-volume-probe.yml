name: MOEX ISS Cross-Timeframe Volume Probe (Read Only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research_agent/volume_probe.py"
      - "research_agent/volume_probe_cases.json"
      - ".github/workflows/iss-minute-volume-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Russian NCA certificates for MOEX
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://gu-st.ru/content/downloads/Russian_Trusted_Root_CA.cer \
            --output /tmp/russian_trusted_root_ca.cer
          curl --fail --silent --show-error --location \
            https://gu-st.ru/content/downloads/Russian_Trusted_Sub_CA_2024.cer \
            --output /tmp/russian_trusted_sub_ca.cer

          convert_cert() {
            local source="$1"
            local target="$2"
            if openssl x509 -in "$source" -noout >/dev/null 2>&1; then
              cp "$source" "$target"
            else
              openssl x509 -inform DER -in "$source" -out "$target"
            fi
          }
          convert_cert /tmp/russian_trusted_root_ca.cer /tmp/russian_trusted_root_ca.crt
          convert_cert /tmp/russian_trusted_sub_ca.cer /tmp/russian_trusted_sub_ca.crt

          root_fp="$(openssl x509 -in /tmp/russian_trusted_root_ca.crt -noout -fingerprint -sha256 | cut -d= -f2)"
          sub_fp="$(openssl x509 -in /tmp/russian_trusted_sub_ca.crt -noout -fingerprint -sha256 | cut -d= -f2)"
          expected_root="D2:6D:2D:02:31:B7:C3:9F:92:CC:73:85:12:BA:54:10:35:19:E4:40:5D:68:B5:BD:70:3E:97:88:CA:8E:CF:31"
          expected_sub="21:55:78:50:36:C9:00:DB:B5:F1:BB:2A:15:69:C8:0C:55:59:5B:D6:BF:94:86:7A:29:BB:DD:BC:7D:88:A3:F2"
          test "$root_fp" = "$expected_root"
          test "$sub_fp" = "$expected_sub"

          sudo install -m 0644 /tmp/russian_trusted_root_ca.crt /usr/local/share/ca-certificates/russian_trusted_root_ca.crt
          sudo install -m 0644 /tmp/russian_trusted_sub_ca.crt /usr/local/share/ca-certificates/russian_trusted_sub_ca.crt
          sudo update-ca-certificates
      - name: Run read-only MOEX interval-1 versus interval-24 probe
        run: python -m research_agent.volume_probe --output moex_iss_volume_probe.json
      - name: Upload volume probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moex-iss-cross-timeframe-volume-probe
          path: moex_iss_volume_probe.json
          if-no-files-found: warn
          retention-days: 30
