name: Finam Options gRPC Stream Probe (Read Only)

on:
  workflow_dispatch:
    inputs:
      capture_seconds:
        description: "Capture duration (30–300 seconds)"
        required: true
        default: "120"
        type: string

permissions:
  contents: read

concurrency:
  group: finam-options-grpc-stream-probe
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official Finam SDK
        run: pip install "finam-sdk==2.19.1"
      - name: Capture gRPC market-data streams
        env:
          FINAM_API_SECRET: ${{ secrets.FINAM_API_SECRET }}
          CAPTURE_SECONDS: ${{ inputs.capture_seconds }}
          OPTION_SYMBOLS: GZ100CX6@RTSX,SR290CX6@RTSX
        run: python research/finam_options_grpc_stream_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finam-options-grpc-stream-probe
          path: finam-options-grpc-streams.jsonl
          if-no-files-found: warn
          retention-days: 30
