name: MOEX Options Read-Only Data Probe

on:
  pull_request:
    paths:
      - "research_agent/options_probe.py"
      - "tests/test_options_probe.py"
      - ".github/workflows/moex-options-readonly-probe.yml"
      - "docs/MOEX_OPTIONS_RESEARCH_PLAN_2026-11-26.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-options-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FINAM_API_SECRET: ${{ secrets.FINAM_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install probe dependency
        run: python -m pip install requests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -p "test_options_probe.py" -v
      - name: Query Finam option chains and sampled market quotes (GET only)
        run: python research_agent/options_probe.py
      - name: Upload redacted market-data probe
        uses: actions/upload-artifact@v4
        with:
          name: moex-options-readonly-probe
          path: artifacts/moex_options_probe.json
          if-no-files-found: error
          retention-days: 7
