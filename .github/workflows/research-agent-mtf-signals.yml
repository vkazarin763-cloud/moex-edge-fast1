name: MOEX EDGE MTF Signals (Read Only)

on:
  workflow_run:
    workflows:
      - "MOEX EDGE Multi-Timeframe Candles (Read Only)"
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful multi-timeframe candle workflow run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: moex-edge-mtf-signal-scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve source workflow run
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RUN_ID="$INPUT_RUN_ID"
          else
            RUN_ID="$WORKFLOW_RUN_ID"
          fi
          case "$RUN_ID" in
            ''|*[!0-9]*) echo "Invalid source run ID"; exit 1 ;;
          esac
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download validated MTF candle artifact
        uses: actions/download-artifact@v4
        with:
          name: moex-edge-multi-timeframe-candles
          path: mtf-data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Wait for the current research run and resolve its registry
        id: research
        uses: actions/github-script@v7
        timeout-minutes: 45
        with:
          script: |
            const listed = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "research-agent-run.yml",
              per_page: 1
            });
            if (!listed.data.workflow_runs.length) {
              core.setFailed("No research run exists; refusing to scan without a strategy registry.");
              return;
            }
            const runId = listed.data.workflow_runs[0].id;
            const deadline = Date.now() + 40 * 60 * 1000;
            let run = listed.data.workflow_runs[0];
            while (run.status !== "completed" && Date.now() < deadline) {
              await new Promise(resolve => setTimeout(resolve, 15000));
              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId
              });
              run = response.data;
            }
            if (run.status !== "completed" || run.conclusion !== "success") {
              core.setFailed("Latest research run did not complete successfully; refusing to use an older registry.");
              return;
            }
            core.setOutput("run_id", String(runId));
      - name: Download research report and strategy registry
        uses: actions/download-artifact@v4
        with:
          name: moex-edge-research-report
          path: research-data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.research.outputs.run_id }}
      - name: Run read-only D1/H1 signal scanner gated by PASS registry
        run: |
          python -m research_agent.mtf_scanner \
            --candles mtf-data/moex_edge_multi_timeframe_candles.json \
            --validation mtf-data/moex_edge_multi_timeframe_validation.json \
            --registry research-data/strategy_registry.json \
            --output moex_edge_mtf_signals.json
      - name: Publish concise signal summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("moex_edge_mtf_signals.json").read_text(encoding="utf-8"))
          lines = [
              "# MOEX EDGE D1/H1 signal scan",
              "",
              f"- As of (UTC): {report.get('as_of_utc')}",
              f"- Universe: {report.get('universe_size')} symbols; "
              f"{report.get('symbols_with_d1_h1_data')} with valid D1/H1 data",
              f"- Signals: **{report.get('signals_count', 0)}**",
              f"- Registry: {report.get('strategy_registry_version')}; filtered candidates: {report.get('registry_filtered_candidates', 0)}",
              f"- Skipped symbols: {len(report.get('skipped_symbols', []))}",
              "- Read-only output; no position sizing, capital allocation, or order placement.",
              "- H1 alignment is informational and does not suppress D1 signals.",
              "",
              "| Symbol | Direction | Strategy | D1 close | H1 confirmation |",
              "|---|---|---|---:|---|",
          ]
          signals = report.get("signals", [])
          if signals:
              for item in signals:
                  close = item.get("d1_close")
                  close_text = f"{float(close):.6g}" if close is not None else "—"
                  lines.append(
                      f"| {item.get('symbol')} | {item.get('direction')} | "
                      f"{item.get('strategy')} | {close_text} | "
                      f"{item.get('h1_confirmation')} |"
                  )
          else:
              lines.append("| — | — | — | — | — |")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY
      - name: Upload signal report
        uses: actions/upload-artifact@v4
        with:
          name: moex-edge-mtf-signals-${{ steps.source.outputs.run_id }}
          path: moex_edge_mtf_signals.json
          if-no-files-found: error
          retention-days: 30
