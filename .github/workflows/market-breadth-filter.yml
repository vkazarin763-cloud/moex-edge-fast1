name: MOEX H1 market breadth filter (research only)
on:
  push:
    branches:
      - research/price-forecast-24h-v1
    paths:
      - "research_agent/price_forecast_24h/evaluate_market_breadth_filter.py"
      - ".github/workflows/market-breadth-filter.yml"
      - "research_agent/price_forecast_24h/evaluate_direction_mechanics.py"
      - "research_agent/price_forecast_24h/evaluate_ohlc_strategies.py"
permissions:
  contents: write
concurrency:
  group: price-forecast-24h-research-write
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/price-forecast-24h-v1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile research_agent/price_forecast_24h/evaluate_market_breadth_filter.py
      - name: Run exact-timestamp MOEX breadth comparison
        run: python -m research_agent.price_forecast_24h.evaluate_market_breadth_filter
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_agent/price_forecast_24h/reports/market-breadth-filter-*
          git commit -m "research: report MOEX market breadth filter"
          git pull --rebase origin research/price-forecast-24h-v1
          git push origin HEAD:research/price-forecast-24h-v1
      - uses: actions/upload-artifact@v4
        with:
          name: market-breadth-filter
          path: research_agent/price_forecast_24h/reports/market-breadth-filter-*
          retention-days: 30
