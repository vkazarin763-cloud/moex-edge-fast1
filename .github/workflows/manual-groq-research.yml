name: Manual AI Research Team

on:
  push:
    branches:
      - feature/openrouter-primary-groq-fallback
    paths:
      - "research_agent/ai_team.py"
      - "research_agent/cli.py"
      - "research_agent/validation.py"
      - "research_agent/quality.py"
      - "research_agent/session_mapping.py"
      - "research_agent/strategy_registry.py"
      - "tests/test_research_ai_team.py"
      - "tests/test_research_holdout.py"
      - "tests/test_research_quality.py"
      - ".github/workflows/manual-groq-research.yml"
  workflow_dispatch:
    inputs:
      date_from:
        description: "Research start date YYYY-MM-DD (blank = rolling 3 years)"
        required: false
        type: string
      date_till:
        description: "Research end date YYYY-MM-DD (blank = latest completed MOEX date)"
        required: false
        type: string
      model:
        description: "Primary OpenRouter model ID"
        required: false
        type: string
        default: "openrouter/free"
      fallback_model:
        description: "Free NVIDIA backup model on OpenRouter"
        required: false
        type: string
        default: "nvidia/nemotron-3-ultra-550b-a55b:free"
      tickers:
        description: "Comma-separated MOEX tickers for the small pilot"
        required: true
        type: string
        default: "SBER,GAZP,LKOH,NVTK,MOEX"

permissions:
  contents: read

concurrency:
  group: manual-ai-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-research-team:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile isolated module and run offline tests
        run: |
          python -m compileall -q research_agent tests
          python -m unittest tests.test_research_ai_team tests.test_research_holdout tests.test_research_quality -v

      - name: Resolve research dates
        id: dates
        env:
          INPUT_FROM: ${{ inputs.date_from }}
          INPUT_TILL: ${{ inputs.date_till }}
        run: |
          END="${INPUT_TILL:-$(date -u +%F)}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            START="${INPUT_FROM:-2023-11-20}"
          else
            START="${INPUT_FROM:-$(date -u -d '3 years ago' +%F)}"
          fi
          export START END
          python - <<'PY'
          import os
          from datetime import date
          from pathlib import Path
          start = date.fromisoformat(os.environ["START"])
          end = date.fromisoformat(os.environ["END"])
          if start > end:
              raise SystemExit("date_from must not be after date_till")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"date_from={start.isoformat()}\n")
              out.write(f"date_till={end.isoformat()}\n")
          PY

      - name: Generate deterministic research report from MOEX ISS
        env:
          DATE_FROM: ${{ steps.dates.outputs.date_from }}
          DATE_TILL: ${{ steps.dates.outputs.date_till }}
          TICKERS: ${{ inputs.tickers || 'SBER,GAZP,LKOH,NVTK,MOEX' }}
        run: |
          set +e
          python -m research_agent.cli \
            --from "$DATE_FROM" \
            --till "$DATE_TILL" \
            --tickers "$TICKERS" \
            --output research_report.json
          research_exit=$?
          set -e
          if [ "$research_exit" -eq 3 ] && [ -s research_report.json ]; then
            echo "::warning::Research report is structurally INCOMPLETE; the AI commentary will be explicitly limited."
          elif [ "$research_exit" -ne 0 ]; then
            exit "$research_exit"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research_report.json")
          if not p.is_file():
              raise SystemExit("MOEX research report was not created.")
          report = json.loads(p.read_text(encoding="utf-8"))
          if not isinstance(report, dict) or not isinstance(report.get("results"), dict):
              raise SystemExit("Unexpected MOEX research report structure.")
          registry_path = Path("strategy_registry.json")
          if not registry_path.is_file():
              raise SystemExit("Direction-specific strategy_registry.json was not created.")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          if not isinstance(registry, dict) or not isinstance(registry.get("strategies"), list):
              raise SystemExit("Unexpected strategy registry structure.")
          if registry.get("source_report_generated_at_utc") != report.get("generated_at_utc"):
              raise SystemExit("Strategy registry does not match the generated research report.")
          if registry.get("source_report_date_till") != report.get("date_till"):
              raise SystemExit("Strategy registry date does not match the research report.")
          print(f"Validated direction-specific registry: {len(registry['strategies'])} candidates; summary={registry.get('summary')}")
          audit = report.get("independent_validation", {})
          if audit.get("status") not in {"INDEPENDENT_VALIDATION_PASS", "INDEPENDENT_VALIDATION_INCOMPLETE"}:
              raise SystemExit("Independent structural validation did not pass or return warning-only INCOMPLETE.")
          if audit.get("errors"):
              raise SystemExit("Independent structural validation contains errors; refusing AI commentary.")
          print(f"Validated source report: {len(report['results'])} instruments; audit={audit.get('status')}")
          PY

      - name: Check OpenRouter key (without displaying secrets)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get("OPENROUTER_API_KEY", "").strip():
              raise SystemExit("OPENROUTER_API_KEY is missing from repository Actions secrets.")
          print("OpenRouter API key is configured.")
          PY

      - name: Run four-agent research commentary
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.model || 'openrouter/free' }}
          OPENROUTER_BACKUP_MODEL: ${{ inputs.fallback_model || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
          AI_PROVIDER: "openrouter"
        run: |
          python -m research_agent.ai_team --input research_report.json --registry strategy_registry.json --output ai_commentary.json

      - name: Upload source report and AI commentary (also when AI provider fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-research-report-${{ github.run_id }}
          path: |
            research_report.json
            strategy_registry.json
            ai_commentary.json
          if-no-files-found: warn
          retention-days: 14
