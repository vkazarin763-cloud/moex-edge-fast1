name: Manual AI Agents Smoke Test

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Groq model ID"
        required: false
        type: string
        default: "openai/gpt-oss-20b"

permissions:
  contents: read

concurrency:
  group: ai-agents-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agents-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile module and run offline tests
        run: |
          python -m compileall -q research_agent tests
          python -m unittest tests.test_research_ai_team -v

      - name: Create tiny synthetic diagnostic input (no MOEX data or signals)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          fixture = {
              "report_type": "SYNTHETIC_AGENT_SMOKE_TEST",
              "notice": "Synthetic fixture only. Not market data, not a backtest, not a trading signal.",
              "generated_at_utc": "workflow-runtime",
              "source": {"kind": "synthetic", "market_data_loaded": False},
              "universe": {"count": 1, "instruments": ["DEMO_ONLY"]},
              "independent_validation": {
                  "status": "NOT_RUN",
                  "reason": "Agent connectivity smoke test skips quantitative research."
              },
              "results": {},
              "expected_agent_behavior": [
                  "state that all evidence is synthetic",
                  "do not infer profitability",
                  "do not produce a LONG or SHORT signal",
                  "identify missing real-market evidence"
              ]
          }
          Path("smoke_input.json").write_text(
              json.dumps(fixture, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8"
          )
          PY

      - name: Check Groq secret (without displaying it)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get("GROQ_API_KEY", "").strip():
              raise SystemExit("GROQ_API_KEY is missing.")
          print("Groq secret is configured.")
          PY

      - name: Run three specialists and coordinator (4 live Groq API calls)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ inputs.model }}
        run: |
          python -m research_agent.ai_team \\
            --input smoke_input.json \\
            --output smoke_result.json

      - name: Validate agent output
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("smoke_result.json").read_text(encoding="utf-8"))
          expected_roles = {"market_analyst", "strategy_researcher", "skeptical_reviewer"}
          assert result.get("status") == "AI_COMMENTARY_EVIDENCE_CHECKED", result.get("status")
          assert result.get("provider") == "groq_api", result.get("provider")
          assert result.get("model") == "${{ inputs.model }}"
          assert result.get("calls") == 4, result.get("calls")
          specialists = result.get("specialists")
          assert isinstance(specialists, dict) and set(specialists) == expected_roles
          assert all(isinstance(item, dict) for item in specialists.values())
          coordinator = result.get("coordinator")
          assert isinstance(coordinator, dict)
          assert result.get("fact_check", {}).get("status") == "PASS"
          assert result["fact_check"].get("numeric_claims_in_free_text") == 0
          print("PASS: three specialists and coordinator returned validated Groq responses.")
          print("Provider: Groq")
          print("Model: " + result["model"])
          print("Live API calls: " + str(result["calls"]))
          PY

      - name: Upload smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agents-smoke-${{ github.run_id }}
          path: |
            smoke_input.json
            smoke_result.json
          if-no-files-found: warn
          retention-days: 14
