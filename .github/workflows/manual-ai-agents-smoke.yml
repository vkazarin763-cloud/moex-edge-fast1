name: Manual AI Agents Smoke Test

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Groq model ID"
        required: false
        type: string
        default: "openai/gpt-oss-20b"

permissions:
  contents: read

concurrency:
  group: ai-agents-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agents-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and run offline agent safety tests
        run: |
          python -m compileall -q research_agent tests
          python -m unittest tests.test_research_ai_team tests.test_agent_discovery tests.test_agent_signal_verifier tests.test_operational_agent_integration -v

      - name: Create synthetic no-market-data agent input
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          snapshot = now.isoformat()
          today_moscow = now.astimezone(ZoneInfo("Europe/Moscow")).date().isoformat()
          scan = {
              "status": "READ_ONLY_LATEST_SIGNAL_SCAN",
              "generated_at_utc": snapshot,
              "as_of_utc": snapshot,
              "universe": ["DEMO_ONLY"],
              "signals_count": 0,
              "signals": [],
              "methodology": "Synthetic connectivity test; no market candles or real instruments.",
          }
          registry = {
              "stage": "DEVELOPMENT_ONLY_NOT_PRODUCTION_APPROVAL",
              "source_report_date_till": today_moscow,
              "holdout_used_for_selection": False,
              "scanner_contract": {
                  "consume_only_status": "PASS",
                  "live_trading_authorized": False,
              },
              "summary": {"PASS": 0, "REJECT": 0, "INSUFFICIENT_DATA": 0},
              "strategies": [],
          }
          model_version = "SYNTHETIC_SMOKE_ONLY_NOT_A_REAL_MODEL"
          forecast = {
              "report_type": "MOEX_EDGE_OPERATIONAL_DIRECTION_FORECAST_V1",
              "status": "COMPLETE",
              "model_version": model_version,
              "as_of_date": today_moscow,
              "generated_at_utc": snapshot,
              "universe": ["DEMO_ONLY"],
              "forecasts": [
                  {
                      "ticker": "DEMO_ONLY",
                      "horizon_sessions": horizon,
                      "status": "EXPERIMENTAL_NOT_CALIBRATED",
                      "model_version": model_version,
                      "post_holdout_outcomes_used": False,
                      "predicted_class": "SIDEWAYS",
                      "probability_down": 0.2,
                      "probability_sideways": 0.6,
                      "probability_up": 0.2,
                  }
                  for horizon in (1, 5, 20)
              ],
              "holdout_policy": {
                  "holdout_start": "2026-11-20",
                  "post_holdout_outcomes_used_for_training": 0,
                  "post_holdout_outcomes_used_for_model_selection": 0,
                  "post_holdout_outcomes_used_for_calibration": 0,
                  "post_holdout_outcomes_used_for_performance_metrics": 0,
                  "inference_parameters_frozen_before_holdout": True,
              },
              "notice": "Synthetic fixture only. Probabilities are placeholders, not market forecasts.",
          }
          for filename, data in (
              ("smoke_scan.json", scan),
              ("smoke_registry.json", registry),
              ("smoke_forecast.json", forecast),
          ):
              Path(filename).write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          print("Created one synthetic symbol, three placeholder horizons, zero market candles, zero signal candidates.")
          PY

      - name: Check Groq secret (without displaying it)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get("GROQ_API_KEY", "").strip():
              raise SystemExit("GROQ_API_KEY is missing.")
          print("Groq secret is configured.")
          PY

      - name: Run the three MOEX EDGE discovery roles (3 live Groq API calls)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ inputs.model }}
        run: |
          python -m research_agent.agent_discovery \
            --scan smoke_scan.json \
            --registry smoke_registry.json \
            --forecast smoke_forecast.json \
            --groq-model "$GROQ_MODEL" \
            --proposals smoke_agent_proposals.json \
            --diagnostics smoke_agent_diagnostics.json \
            --verification smoke_agent_verification.json

      - name: Validate agent connectivity and no-signal behavior
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          proposals = json.loads(Path("smoke_agent_proposals.json").read_text(encoding="utf-8"))
          diagnostics = json.loads(Path("smoke_agent_diagnostics.json").read_text(encoding="utf-8"))
          verification = json.loads(Path("smoke_agent_verification.json").read_text(encoding="utf-8"))
          assert proposals.get("status") == "AGENT_SIGNAL_PROPOSALS"
          assert proposals.get("proposals") == [], "Synthetic smoke test must not create a signal."
          assert proposals.get("forecast_reviews") == [], "No synthetic candidate exists to review."
          assert diagnostics.get("status") == "AGENT_DISCOVERY_COMPLETE"
          assert diagnostics.get("agent_count") == 3
          assert diagnostics.get("providers_used") == ["groq_fallback"] * 3
          assert diagnostics.get("forecast_model_version") == "SYNTHETIC_SMOKE_ONLY_NOT_A_REAL_MODEL"
          assert diagnostics.get("agents_can_modify_probabilities") is False
          assert diagnostics.get("consensus_proposal_count") == 0
          assert verification.get("status") == "AGENT_SIGNAL_VERIFICATION_COMPLETE"
          assert verification.get("proposal_count") == 0
          assert verification.get("results") == []
          print("PASS: all three MOEX EDGE discovery roles completed; zero market data, zero candidates, zero signals.")
          print("Provider: Groq")
          print("Model: " + str(diagnostics.get("model")))
          print("Live API calls: " + str(len(diagnostics.get("providers_used", []))))
          PY

      - name: Upload synthetic smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moex-edge-agent-smoke-${{ github.run_id }}
          path: |
            smoke_scan.json
            smoke_registry.json
            smoke_forecast.json
            smoke_agent_proposals.json
            smoke_agent_diagnostics.json
            smoke_agent_verification.json
          if-no-files-found: warn
          retention-days: 14
